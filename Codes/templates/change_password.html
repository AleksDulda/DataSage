{% extends "base.html" %}
{% block title %}Şifre Değiştir - DATASAGE{% endblock %}

{% block content %}
<section class="profile-section py-6 min-vh-100">
  <div class="profile-bg"></div>
  <div class="container position-relative z-3">
    <div class="row justify-content-center">
      <div class="col-xl-8 col-lg-9">
        <!-- Header -->
        <div class="profile-header text-center mb-5" data-aos="fade-up">
          <div class="section-badge">Hesap Güvenliği</div>
        </div>

        <!-- Password Form Card -->
        <div class="profile-card" data-aos="fade-up" data-aos-delay="200">
          <form method="POST" action="{{ url_for('change_password') }}">
            <div class="profile-form-section">
              <h3 class="form-section-title">
                <i class="bi bi-shield-lock me-2"></i>Yeni Şifre Belirleme
              </h3>

              <div class="row">
                <div class="col-12">
                  <div class="form-group">
                    <label for="old_password" class="form-label">
                      <i class="bi bi-lock me-2"></i>Mevcut Şifre
                    </label>
                    <input type="password" class="form-control form-control-modern" id="old_password" name="old_password" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group">
                    <label for="new_password" class="form-label">
                      <i class="bi bi-lock-fill me-2"></i>Yeni Şifre
                    </label>
                    <input type="password" class="form-control form-control-modern" id="new_password" name="new_password" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group">
                    <label for="confirm_password" class="form-label">
                      <i class="bi bi-lock-fill me-2"></i>Yeni Şifre (Tekrar)
                    </label>
                    <input type="password" class="form-control form-control-modern" id="confirm_password" name="confirm_password" required>
                  </div>
                </div>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="bi bi-check-circle me-2"></i>Şifreyi Güncelle
                </button>
                <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary btn-lg">
                  <i class="bi bi-arrow-left me-2"></i>Profili Geri Dön
                </a>
              </div>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block styles %}
<style>
:root {
  --profile-card-radius: 24px;
  --profile-transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.profile-section {
  background: linear-gradient(135deg, #f8fafe 0%, #e8efff 100%);
  position: relative;
  overflow: hidden;
  padding-top: 3rem;
  padding-bottom: 6rem;
}

.profile-bg {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at 30% 20%, rgba(0, 123, 255, 0.08) 0%, transparent 50%),
              radial-gradient(circle at 70% 80%, rgba(102, 16, 242, 0.06) 0%, transparent 50%);
  pointer-events: none;
}

.section-badge {
  display: inline-block;
  padding: 8px 20px;
  background: rgba(0, 123, 255, 0.1);
  color: var(--bs-primary);
  border-radius: 50px;
  font-size: 0.875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 1rem;
}

.section-title {
  font-size: 3rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
  color: #2c3e50;
}

.section-subtitle {
  font-size: 1.25rem;
  color: #6c757d;
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.6;
}

.profile-card {
  background: white;
  border-radius: var(--profile-card-radius);
  padding: 3rem;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
  border: 1px solid rgba(0, 123, 255, 0.08);
  transition: var(--profile-transition);
  position: relative;
  overflow: hidden;
}

.profile-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--bs-primary), var(--bs-info));
}

.form-section-title {
  font-size: 1.5rem;
  font-weight: 600;
  color: #2c3e50;
  margin-bottom: 2.5rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid #e9ecef;
  display: flex;
  align-items: center;
}

.form-group {
  margin-bottom: 2.25rem;
}

.form-label {
  font-weight: 600;
  color: #495057;
  margin-bottom: 0.85rem;
  display: flex;
  align-items: center;
  font-size: 0.95rem;
}

.form-label i {
  color: var(--bs-primary);
}

.form-control-modern {
  padding: 18px 20px;
  border: 2px solid #e9ecef;
  border-radius: 14px;
  font-size: 1.05rem;
  transition: var(--profile-transition);
  background: #f8f9fa;
}

.form-control-modern:focus {
  border-color: var(--bs-primary);
  box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
  background: white;
  outline: none;
}

.form-actions {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 2px solid #e9ecef;
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.btn-lg {
  padding: 14px 28px;
  font-size: 1.05rem;
  font-weight: 600;
  border-radius: 12px;
  transition: var(--profile-transition);
  display: flex;
  align-items: center;
  text-decoration: none;
}

.btn-lg:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

/* Dark mode */
html[data-bs-theme="dark"] .profile-section {
  background: linear-gradient(135deg, #1a1d23 0%, #15171d 100%);
}

html[data-bs-theme="dark"] .profile-bg {
  background: radial-gradient(circle at 30% 20%, rgba(76, 140, 255, 0.1) 0%, transparent 50%),
              radial-gradient(circle at 70% 80%, rgba(102, 16, 242, 0.08) 0%, transparent 50%);
}

html[data-bs-theme="dark"] .section-title {
  color: #f4f7fa;
}

html[data-bs-theme="dark"] .section-subtitle {
  color: #a9b5c7;
}

html[data-bs-theme="dark"] .profile-card {
  background: #1e2329;
  border-color: #2d3748;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

html[data-bs-theme="dark"] .form-section-title,
html[data-bs-theme="dark"] .form-label {
  color: #e2e8f0;
}

html[data-bs-theme="dark"] .form-control-modern {
  background: #2d3748;
  border-color: #4a5568;
  color: #e2e8f0;
}

html[data-bs-theme="dark"] .form-control-modern:focus {
  background: #1a202c;
  border-color: #4c8cff;
}
</style>
{% endblock %}


{% block scripts %}
{{ super() }}
<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.querySelector("form");

  form.addEventListener("submit", function (e) {
    const newPassword = document.getElementById("new_password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    if (newPassword.length < 6) {
      e.preventDefault();
      alert("Yeni şifre en az 6 karakter olmalıdır.");
      return;
    }

    if (newPassword !== confirmPassword) {
      e.preventDefault();
      alert("Yeni şifreler eşleşmiyor.");
      return;
    }
  });
});
</script>
{% endblock %}
