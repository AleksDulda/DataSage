{% extends "base.html" %}
{% block title %}Yeni Şifre Belirle - DATASAGE{% endblock %}

{% block content %}
<section class="profile-section py-6 min-vh-100">
  <div class="profile-bg"></div>
  <div class="container position-relative z-3">
    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-7">
        <!-- Header -->
        <div class="profile-header text-center mb-5" data-aos="fade-up">
          <div class="section-badge">Şifre Sıfırlama</div>
        </div>

        <!-- Password Reset Card -->
        <div class="profile-card" data-aos="fade-up" data-aos-delay="200">
          <form method="POST">
            <div class="profile-form-section">
              <h3 class="form-section-title">
                <i class="bi bi-key me-2"></i>Şifreyi Güncelle
              </h3>

              <div class="form-group">
                <label for="new_password" class="form-label">
                  <i class="bi bi-lock-fill me-2"></i>Yeni Şifre
                </label>
                <input type="password" id="new_password" name="new_password" class="form-control form-control-modern" required>
              </div>

              <div class="form-group">
                <label for="confirm_password" class="form-label d-flex justify-content-between align-items-center">
                  <span><i class="bi bi-lock-fill me-2"></i>Yeni Şifre (Tekrar)</span>
                  <span onclick="togglePassword()" style="cursor:pointer;" title="Göster/Gizle">
                    <i class="bi bi-eye-fill"></i>
                  </span>
                </label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control form-control-modern" required>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn-success btn-lg">
                  <i class="bi bi-check-circle me-2"></i>Şifreyi Güncelle
                </button>
              </div>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block styles %}
<style>
/* Daha önceki profile-section stilini uygula */
.profile-section {
  background: linear-gradient(135deg, #f8fafe 0%, #e8efff 100%);
  position: relative;
  overflow: hidden;
  padding-top: 3rem;
  padding-bottom: 6rem;
}

.profile-bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle at 30% 20%, rgba(0, 123, 255, 0.08), transparent 50%),
              radial-gradient(circle at 70% 80%, rgba(102, 16, 242, 0.06), transparent 50%);
  pointer-events: none;
}

.section-badge {
  display: inline-block;
  padding: 8px 20px;
  background: rgba(0, 123, 255, 0.1);
  color: var(--bs-primary);
  border-radius: 50px;
  font-size: 0.875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 1rem;
}

.section-title {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 1.2rem;
  color: #2c3e50;
}

.section-subtitle {
  font-size: 1.1rem;
  color: #6c757d;
  max-width: 500px;
  margin: 0 auto;
  line-height: 1.6;
}

.profile-card {
  background: white;
  border-radius: 24px;
  padding: 2.5rem;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
  border: 1px solid rgba(0, 123, 255, 0.08);
  position: relative;
  overflow: hidden;
}

.profile-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--bs-primary), var(--bs-info));
}

.form-section-title {
  font-size: 1.4rem;
  font-weight: 600;
  color: #2c3e50;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid #e9ecef;
  display: flex;
  align-items: center;
}

.form-group {
  margin-bottom: 2rem;
}

.form-label {
  font-weight: 600;
  color: #495057;
  margin-bottom: 0.75rem;
  font-size: 0.95rem;
}

.form-control-modern {
  padding: 14px 18px;
  border: 2px solid #e9ecef;
  border-radius: 12px;
  font-size: 1rem;
  transition: all 0.3s;
  background: #f8f9fa;
}

.form-control-modern:focus {
  border-color: var(--bs-primary);
  box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
  background: white;
  outline: none;
}

.form-actions {
  margin-top: 2rem;
  text-align: center;
}

/* Dark mode uyumu */
html[data-bs-theme="dark"] .profile-section {
  background: linear-gradient(135deg, #1a1d23, #15171d);
}
html[data-bs-theme="dark"] .profile-bg {
  background: radial-gradient(circle at 30% 20%, rgba(76, 140, 255, 0.1), transparent 50%),
              radial-gradient(circle at 70% 80%, rgba(102, 16, 242, 0.08), transparent 50%);
}
html[data-bs-theme="dark"] .profile-card {
  background: #1e2329;
  border-color: #2d3748;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}
html[data-bs-theme="dark"] .section-title,
html[data-bs-theme="dark"] .form-label,
html[data-bs-theme="dark"] .form-section-title {
  color: #f7fafc;
}
html[data-bs-theme="dark"] .form-control-modern {
  background: #2d3748;
  border-color: #4a5568;
  color: #e2e8f0;
}
html[data-bs-theme="dark"] .form-control-modern:focus {
  background: #1a202c;
  border-color: #4c8cff;
}
</style>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
function togglePassword() {
  const input = document.getElementById("confirm_password");
  input.type = input.type === "password" ? "text" : "password";
}
</script>
{% endblock %}
